<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DOM Examples</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    section {
      margin-bottom: 30px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
    }

    .box {
      padding: 10px;
      border: 1px solid #ccc;
      margin: 5px 0;
    }

    .active {
      background: #e0f0ff;
    }

    .hidden {
      display: none;
    }

    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

<h1 id="title">DOM ES5 Examples</h1>

<section>
  <h2>Text / HTML</h2>
  <div id="text" class="box">Исходный текст</div>
  <button id="textBtn">Изменить текст</button>
  <button id="htmlBtn">Изменить HTML</button>
</section>

<section>
  <h2>Classes</h2>
  <div id="classBox" class="box">Box</div>
  <button id="classBtn">Toggle class</button>
</section>

<section>
  <h2>Attributes</h2>
  <img id="img" src="https://via.placeholder.com/100">
  <button id="attrBtn">Сменить картинку</button>
</section>

<section>
  <h2>Dataset</h2>
  <div id="dataBox" class="box" data-id="10" data-status="active">
    Dataset box
  </div>
</section>

<section>
  <h2>Create / Remove</h2>
  <ul id="list"></ul>
  <button id="addItem">Добавить</button>
  <button id="clearList">Очистить</button>
</section>

<section>
  <h2>Event Delegation</h2>
  <ul id="delegation">
    <li class="item">Item 1</li>
    <li class="item">Item 2</li>
  </ul>
</section>

<section>
  <h2>Form</h2>
  <form id="form">
    <input name="email" placeholder="Email" required>
    <button type="submit">Send</button>
  </form>
</section>

<section>
  <h2>Inputs</h2>
  <input id="input">
  <input type="checkbox" id="checkbox">
  <button id="inputBtn">Check</button>
</section>

<section style="height: 300px;">
  <h2>Scroll</h2>
  <button id="scrollBtn">Scroll down</button>
</section>

<section>
  <h2>Styles</h2>
  <div id="styleBox" class="box">Styled box</div>
  <button id="styleBtn">Change styles</button>
</section>

<section>
  <h2>Show / Hide</h2>
  <div id="toggleBox" class="box">Toggle me</div>
  <button id="toggleBtn">Toggle visibility</button>
</section>

<script src="dom-es5.js"></script>
</body>
</html>
